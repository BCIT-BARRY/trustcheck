name: bbdevhq-ci

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  bbdevhq-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Conventional commits
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Changeset present
        if: github.base_ref == 'dev' && !startsWith(github.head_ref, 'changeset-release/')
        run: node scripts/bbdevhq-changeset-required.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
