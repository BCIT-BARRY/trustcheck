name: bbdevhq-release

on:
  push:
    branches: [dev]

concurrency: bbdevhq-release

permissions:
  contents: write
  pull-requests: write

jobs:
  bbdevhq-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Empty changesets never bump the version; they are consumed by the next real cut.
      - name: Open or update the cut PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(node -p "require('./package.json').version")
          pnpm run version
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "$BEFORE" ]; then
            echo "No version bump pending; nothing to cut."
            exit 0
          fi
          TITLE="chore(release): cut $VERSION on dev"
          BRANCH=changeset-release/dev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -am "$TITLE"
          git push --force origin "$BRANCH"
          node scripts/bbdevhq-pr-body.mjs cut "$VERSION" > cut-body.md
          EXISTING=$(gh pr list --base dev --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file cut-body.md
          else
            gh pr create --base dev --head "$BRANCH" --title "$TITLE" --body-file cut-body.md
          fi

  bbdevhq-ship:
    needs: bbdevhq-cut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Once a cut lands on dev, keep one PR open that ships that version to main.
      - name: Open or update the ship PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "$VERSION is already released; nothing to ship."
            exit 0
          fi
          TITLE="chore(release): ship $VERSION to main"
          RELEASED=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          node scripts/bbdevhq-pr-body.mjs ship "$VERSION" "$RELEASED" > ship-body.md
          EXISTING=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file ship-body.md
          else
            gh pr create --base main --head dev --title "$TITLE" --body-file ship-body.md
          fi
